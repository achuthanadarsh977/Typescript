<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missing Values per Column</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:30px;max-width:900px;width:95%}h1{text-align:center;color:#333;margin-bottom:20px;font-size:1.4rem}canvas{max-width:100%}</style>
</head>
<body>
  <div class="container"><h1>Missing Values per Column</h1><canvas id="chart" width="800" height="600"></canvas></div>
  <script>new Chart(document.getElementById('chart').getContext('2d'), { type:'bar', data:{ labels:["Date","Sleep_Duration","Mood_Score","Caffeine_Intake_mg","Exercise_Minutes","Screen_Time_Hours","Stress_Level","Water_Intake_Liters","Alcohol_Consumed","Journaled"], datasets:[{ label:'Missing Values', data:[100,100,100,100,100,100,100,100,100,100], backgroundColor:'rgba(255,99,132,0.7)', borderWidth:1 }] }, options:{ responsive:true, plugins:{ title:{ display:true, text:'Missing Values per Column', font:{size:18} } }, scales:{ y:{ beginAtZero:true } } } });</script>
</body>
</html>
