<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drinkers vs Non-drinkers</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f2f5;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.1);padding:30px;max-width:900px;width:95%}h1{text-align:center;color:#333;margin-bottom:20px;font-size:1.4rem}canvas{max-width:100%}</style>
</head>
<body>
  <div class="container"><h1>Drinkers vs Non-drinkers</h1><canvas id="chart" width="800" height="600"></canvas></div>
  <script>new Chart(document.getElementById('chart').getContext('2d'), { type:'bar', data:{ labels:["No","Yes"], datasets:[{ label:'Mean Mood Score', data:[5.483870967741935,5.598522167487685], backgroundColor:['rgba(54,162,235,0.7)','rgba(255,159,64,0.7)'], borderWidth:1 }] }, options:{ responsive:true, plugins:{ title:{ display:true, text:'Drinkers vs Non-drinkers (Mean Mood)', font:{size:18} } }, scales:{ y:{ beginAtZero:true } } } });</script>
</body>
</html>
