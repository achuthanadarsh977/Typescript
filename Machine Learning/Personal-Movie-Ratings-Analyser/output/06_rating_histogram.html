<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histogram of Ratings</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .container { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 30px; max-width: 900px; width: 95%; }
    h1 { text-align: center; color: #333; margin-bottom: 20px; font-size: 1.4rem; }
    canvas { max-width: 100%; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Histogram of Ratings</h1>
    <canvas id="chart" width="800" height="600"></canvas>
  </div>
  <script>
    const ctx = document.getElementById('chart').getContext('2d');
    new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ["1.0-1.5","1.5-2.0","2.0-2.5","2.5-3.0","3.0-3.5","3.5-4.0","4.0-4.5","4.5-5.0","5.0-5.5","5.5-6.0","6.0-6.5","6.5-7.0","7.0-7.5","7.5-8.0","8.0-8.5","8.5-9.0","9.0-9.5","9.5-10.0","10.0-10.5"],
      datasets: [{
        label: 'Frequency',
        data: [18,22,30,18,29,28,28,31,30,17,31,24,18,25,25,22,31,21,2],
        backgroundColor: 'rgba(54, 162, 235, 0.7)',
        borderColor: 'rgba(54, 162, 235, 1)',
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      plugins: { title: { display: true, text: 'Histogram of Ratings', font: { size: 18 } } },
      scales: {
        x: { title: { display: true, text: 'Rating' } },
        y: { beginAtZero: true, title: { display: true, text: 'Frequency' } }
      }
    }
  });
  </script>
</body>
</html>
